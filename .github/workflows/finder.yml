# The finder (finder/README.md): once a day it reads the public record tables and publishes the day's open-task cards
# on Papex through the kit's publisher client; a second job keeps its state, its checker evidence and a one-page log in
# this repository. By hand it can run a dry run (the default) or publish, with its own number of new cards (at most 20).
#
# Setup, once, in the repository's settings: an Environment named "finder", with "Deployment branches" set to main
# only, holding the secret PAPEX_SHARED_WORK_PUBLISHER_TOKEN. Only the "find" job uses that Environment, with read-only
# access to the repository; only the "keep" job may write to it, and it never sees the publisher token.
name: finder

on:
  schedule:
    - cron: "40 5 * * *"  # 05:40 UTC every day
  workflow_dispatch:
    inputs:
      max_new:
        description: "At most this many new cards, 0 to 20 (next rounds and closes are never held back)"
        type: number
        required: false
        default: 5
      dry_run:
        description: "Dry run: read Papex, publish nothing, commit nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: finder
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Keep the download cache between runs (it spares the source sites; never in the repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/finder-cache
          key: finder-cache-${{ github.run_id }}
          restore-keys: finder-cache-

      - name: Run the finder
        env:
          PAPEX_SHARED_WORK_PUBLISHER_TOKEN: ${{ secrets.PAPEX_SHARED_WORK_PUBLISHER_TOKEN }}
          PAPEX_FINDER_CACHE: ${{ runner.temp }}/finder-cache
          EVENT: ${{ github.event_name }}
          MAX_NEW_INPUT: ${{ inputs.max_new }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -eu
          MAX_NEW=5
          DRY_RUN=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MAX_NEW="$MAX_NEW_INPUT"
            DRY_RUN="$DRY_RUN_INPUT"
          fi
          case "$MAX_NEW" in ''|*[!0-9]*) echo "max_new must be a whole number from 0 to 20"; exit 1;; esac
          if [ "$MAX_NEW" -gt 20 ]; then echo "max_new must be a whole number from 0 to 20"; exit 1; fi
          if [ "$DRY_RUN" = "true" ]; then
            python3 finder/run.py --dry-run --read-papex --max-new "$MAX_NEW" --api https://api.papex.org
          else
            python3 finder/run.py --publish --max-new "$MAX_NEW" --api https://api.papex.org
          fi

      - name: Show the day's summary
        if: always()
        run: |
          if [ -f finder/out/summary.md ]; then cat finder/out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      # The finder writes its state before it stops, also when it stops with an error after publishing something:
      # the state is handed to the "keep" job even then.
      - name: Hand the state, the evidence and the summary to the keep job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: finder-state
          path: |
            finder/state
            finder/validation
            finder/out/summary.md
          if-no-files-found: warn
          retention-days: 7

  keep:
    needs: find
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.find.result != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Take the find job's state
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: finder-state
          path: ${{ runner.temp }}/finder-new

      - name: Commit the state, the evidence and the day's log, when they changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEW: ${{ runner.temp }}/finder-new
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          if [ ! -f "$NEW/state/first-seen.json" ]; then
            echo "The find job left no state: nothing to keep."
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          mkdir -p finder/state finder/validation finder/log
          cp -R "$NEW/state/." finder/state/
          if [ -d "$NEW/validation" ]; then cp -R "$NEW/validation/." finder/validation/; fi
          if [ -f "$NEW/out/summary.md" ]; then cp "$NEW/out/summary.md" "finder/log/$day.md"; fi
          git add finder/state finder/validation finder/log
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name="Papex Labs" -c user.email="dev@papex.org" commit -q -m "finder: state and log of $day"
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $basic"
          for try in 1 2 3; do
            if git -c "$auth" push -q origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
            if [ "$try" = 3 ]; then
              break
            fi
            echo "The push was refused (try $try of 3): the branch moved on; rebasing onto it."
            git -c "$auth" fetch -q origin "$BRANCH"
            git -c user.name="Papex Labs" -c user.email="dev@papex.org" rebase -q FETCH_HEAD
          done
          echo "The push was refused three times; the state of this run is in the finder-state artifact."
          exit 1
